<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="color-scheme" content="light dark">
  <title>云朵</title>
  <meta name="description" content="个人日程与待办：接下来要做什么、快速添加、从文字或图片提取日程。">
  <link rel="icon" href="cat-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assistant.css">
  <script src="cat-frames.js" defer></script>
  <script src="app.js" defer></script>
  <script src="color-wheel.js" defer></script>
  <script src="assistant.js" defer></script>
</head>
<body>
  <!-- 背景层：图片 → 遮罩 → 内容。任何背景下文字都保持清晰。 -->
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-image" id="backdropImage"></div>
    <div class="backdrop-scrim"></div>
  </div>

  <main class="app" id="appRoot">
    <div class="screen" id="screenRoot">
      <div class="content">
        <div class="skeleton skeleton-hero"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
      </div>
    </div>
    <nav class="tabbar tabbar-3" id="tabBar" aria-label="主导航"></nav>
  </main>

  <div class="overlay" id="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-content" id="sheetContent"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
