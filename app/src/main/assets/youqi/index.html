<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="color-scheme" content="light dark">
  <title>有期</title>
  <meta name="description" content="个人日程与待办：接下来要做什么、快速添加、从文字或图片提取日程。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236A57AE'/%3E%3Cpath d='M17 22h30v27H17zM24 15v12m16-12v12M17 32h30' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M25 40h14' stroke='%23F1B4B8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- 背景层：图片 → 遮罩 → 内容。任何背景下文字都保持清晰。 -->
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-image" id="backdropImage"></div>
    <div class="backdrop-scrim"></div>
  </div>

  <main class="app" id="appRoot">
    <div class="screen" id="screenRoot">
      <div class="content">
        <div class="skeleton skeleton-hero"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
      </div>
    </div>
    <nav class="tabbar tabbar-3" id="tabBar" aria-label="主导航"></nav>
  </main>

  <div class="overlay" id="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-content" id="sheetContent"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
