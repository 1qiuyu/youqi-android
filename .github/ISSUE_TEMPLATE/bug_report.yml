name: 问题反馈
description: 报告有期使用中的问题
title: "[问题] "
body:
  - type: input
    id: version
    attributes:
      label: 有期版本、手机型号与系统版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期行为和实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或补充信息
      description: 请遮住API Key、个人通知和其他隐私信息。
