name: 发布云朵 APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.YUNDUO_KEYSTORE_BASE64 }}
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 恢复发布签名
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yunduo-release.keystore"
          cat >> "$GITHUB_ENV" <<EOF
          SIGNING_STORE_FILE=$RUNNER_TEMP/yunduo-release.keystore
          SIGNING_STORE_PASSWORD=${{ secrets.YUNDUO_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS=${{ secrets.YUNDUO_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD=${{ secrets.YUNDUO_KEY_PASSWORD }}
          EOF

      - name: 构建 APK
        run: ./gradlew :app:assembleFossDebug --no-daemon

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          APK=$(find app/build/outputs/apk/foss/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "云朵 $VERSION" \
            --generate-notes
