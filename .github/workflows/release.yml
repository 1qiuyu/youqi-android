name: 发布云朵 APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.YUNDUO_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 恢复调试签名（保持手机可覆盖更新）
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi

      - name: 构建 APK
        run: ./gradlew :app:assembleFossDebug --no-daemon

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          APK=$(find app/build/outputs/apk/foss/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "云朵 $VERSION" \
            --notes ""
